name: Coverage Report

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Apresentacao-da-Disciplina/P2-Conteudos/Atividades/Atividade-08

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Coverage
        run: npm run test:coverage
